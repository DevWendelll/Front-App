<app-titulo [titulo]="'Perfil'"></app-titulo>
<div class="card rounded shadow-sm custom-height mx-auto">
    <form>
        <div class="row p-3">
            <div class="col-lg-3 pt-1">
                <div class="card mb-3">
                    <div class="card-header"></div>
                    <div class="d-flex align-self-center pt-3">
                        <a>
                            <img
                                src="https://encrypted-tbn2.gstatic.com/images?q=tbn:ANd9GcRbezqZpEuwGSvitKy3wrwnth5kysKdRqBW54cAszm_wiutku3R"
                                alt="Sobre mim" width="120" height="120" class="rounded-circle">
                        </a>
                    </div>
                    <div class="card-body">
                        <div class="h4 text-center mb-3">&#64;UserName</div>
                        <div class="h7 text-bold pb-1"><b>Nome:</b> Miracles Lee Cross</div>
                        <div class="h7">
                            Developer of web applications, JavaScript, PHP, Java, Python, Ruby, Java, Node.js, etc.
                        </div>
                    </div>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item">
                            <div class="row">
                                <div class="col-6 text-center border-right">
                                    <div class="h5">1342</div>
                                    <div class="h6 text-muted">Eventos Ministrados</div>
                                </div>
                                <div class="col-6 text-center">
                                    <div class="h5">1342</div>
                                    <div class="h6 text-muted">Eventos Participados</div>
                                </div>
                            </div>
                        </li>
                    </ul>
                    <div class="card-footer"></div>
                </div>
            </div>
            <div class="col-lg-9">
                <div class="form-row">
                    <div class="form-group col-12">
                        <h3 class="border-bottom">Detalhe do Perfil</h3>
                    </div>
                    <div class="form-group col-sm-3">
                        <label>Título</label>
                        <select class="form-select">
                            <option value=""></option>
                            <option value="0">Não Quero</option>
                            <option value="Tecnólogo(a)">Tecnólogo(a)</option>
                            <option value="Bacharel">Bacharel</option>
                            <option value="Especialista">Especialista</option>
                            <option value="Pós Graduado(a)">Pós Graduado(a)</option>
                            <option value="Mestre">Mestre</option>
                            <option value="Doutor(a)">Doutor(a)</option>
                            <option value="Pós Doc">Pós Doc</option>
                        </select>
                    </div>
                    <div class="form-group col-sm-4">
                        <label>Primeiro Nome</label>
                        <input type="text" class="form-control" placeholder="Primeiro Nome" />
                    </div>
                    <div class="form-group col-sm-4">
                        <label>Último Nome</label>
                        <input type="text" class="form-control" placeholder="Último Nome" />
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group col-sm-5">
                        <label>E-mail</label>
                        <input type="email" class="form-control" placeholder="exemplo@dominio.com" />
                    </div>
                    <div class="form-group col-sm-4">
                        <label>Telefone</label>
                        <input type="tel" class="form-control" placeholder="(XX) XXXX-XXXX" />
                    </div>
                    <div class="form-group col-sm-3">
                        <label>Função</label>
                        <select class="form-select">
                            <option value=""></option>
                            <option value="Participante">Participante</option>
                            <option value="Palestrante">Palestrante</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group col-12">
                        <label>Descrição</label>
                        <textarea class="form-control" rows="3" placeholder="Descreva-se aqui"></textarea>
                    </div>
                </div>
                <div>
                    <h3 class="pt-3 border-bottom">Mudar Senha</h3>
                    <p>Caso mude de senha, preencha os campos abaixo:</p>
                </div>
                <div class="form-row">
                    <div class="form-group col-sm-6">
                        <label>Senha</label>
                        <input type="password" class="form-control" placeholder="Digite sua senha" />
                    </div>
                    <div class="form-group col-sm-6">
                        <label>Confirmar Senha</label>
                        <input type="password" class="form-control" placeholder="Confirme sua senha" />
                    </div>
                </div>
            </div>
        </div>
        <div class="card-footer">
            <div class="d-flex">
                <button type="button" class="btn btn-outline-secondary me-auto border">
                    Cancelar Alteração
                </button>
                <button type="submit" class="btn btn-success">
                    <span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
                    Salvar Alteração
                </button>
            </div>
        </div>
    </form>
</div>

<style>
    .custom-height {
        min-height: 600px; /* Ajuste a altura mínima conforme necessário */
    }
</style>
