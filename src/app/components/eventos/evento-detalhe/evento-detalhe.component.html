<div class="card rounded shadow-sm">
    <form>
        <div class="p-3">
            <div class="mb-3">
                <label class="form-label">Tema</label>
                <input type="text" class="form-control" placeholder="Insira o Tema">
            </div>
            <div class="row mb-3">
                <div class="col-md-8">
                    <label class="form-label">Local</label>
                    <input type="text" class="form-control" placeholder="Local">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Data e Hora</label>
                    <input type="datetime-local" class="form-control">
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-2">
                    <label class="form-label">Qtd Pessoas</label>
                    <input type="number" class="form-control" placeholder="Qtd">
                </div>
                <div class="col-md-2">
                    <label class="form-label">Telefone</label>
                    <input type="tel" class="form-control" placeholder="(000) 90000-0000">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" placeholder="e-mail">
                </div>
            </div>
        </div>
        <div class="card-footer">
            <div class="d-flex">
                <button type="button" class="btn btn-outline-secondary me-auto border">
                    Cancelar Alteração
                </button>
                <button type="submit" class="btn btn-success">
                    <span class="spinner-border spinner-border-sm me-1"></span>
                    Salvar Evento
                </button>
            </div>
        </div>
    </form>
</div>
